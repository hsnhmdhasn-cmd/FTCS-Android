
name: Build FTCS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          archive=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
          test -n "$archive"
          mkdir unpacked
          unzip -q "$archive" -d unpacked
          test -f unpacked/FTCSAndroid/app/build.gradle

      - name: Build APK
        run: |
          cd unpacked/FTCSAndroid
          gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: FTCS-Android-APK
          path: unpacked/FTCSAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
